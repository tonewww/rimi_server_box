[package]
name = "rust_ssh"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_ssh"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ssh2 = "0.9"
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
once_cell = "1.19"
parking_lot = "0.12"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
